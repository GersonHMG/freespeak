name: lingo_node
description: "Free Speak: offline spoken-English practice, with pronunciation scoring and flashcards."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.2.0+4

environment:
  sdk: ^3.13.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # On-device Phonon TTS runs through its own C library, libptts_ffi.so, built
  # from experiments/xn-ptts and checked in under android/app/src/main/jniLibs.
  # eSpeak-NG as a phonemizer, vendored. GPL v3 -- and so, therefore, is this
  # app; see packages/espeak_ng/LICENSE.md for why that trade was made.
  # Forked down from flutter_kokoro_tts, which keeps the same native build
  # behind lib/src/ and adds a second copy of ONNX Runtime for a TTS pipeline
  # this app does not use.
  espeak_ng:
    path: packages/espeak_ng
  archive: ^4.0.2          # unzips espeak_ng's bundled espeak-ng-data
  ffi: ^2.2.0              # C strings for the Phonon binding (libptts_ffi)
  path_provider: ^2.1.5    # cache dir for the generated WAV files
  audioplayers: ^6.1.0     # playback of those WAV files

  # On-device speech recognition, for scoring what the learner actually said.
  record: ^6.0.0           # captures the attempt as 16 kHz mono WAV
  vosk_flutter_service: 0.1.3

  # Durable per-attempt practice history (PracticeHistoryStore), separate from
  # SessionScore's in-memory per-session totals.
  sqflite: ^2.4.1
  path: ^1.9.0

# permission_handler arrives transitively, via vosk_flutter_service, and is
# not used by this app directly -- `record` handles the microphone permission.
#
# Every permission_handler_android 14.x compiles against Android SDK 37
# symbols (ACCESS_LOCAL_NETWORK, VERSION_CODES.CINNAMON_BUN) that Flutter's
# compileSdk of 36 does not provide, so the Gradle build fails inside the
# package itself. permission_handler 13.x requires _android ^14.0.0, so both
# halves have to come down together: 12.0.3 pairs with _android 13.x, which
# builds against SDK 36.
#
# Safe because vosk_flutter_service touches only Permission.microphone's
# status/request/isGranted -- unchanged between 12.x and 13.x -- and only from
# initSpeechService(), the mic-streaming path this app never calls.
#
# Drop both once compileSdk can be raised to 37.
dependency_overrides:
  permission_handler: 12.0.3
  permission_handler_android: 13.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  # Desktop-backed sqflite implementation, used only by
  # test/practice_history_store_test.dart so it can run without a device.
  sqflite_common_ffi: ^2.3.4+4
  flutter_launcher_icons: ^0.14.4

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/data_en.csv
    # Six everyday-use starter decks per native language
    # (lib/decks/seed_deck.dart's kStarterDeckAssets).
    - assets/decks/
    - assets/branding/icon.png
    # Phonon (phonon-31m-en, Apache-2.0), ~65 MB, copied out to app support
    # on first launch: its C library reads files, not the asset bundle.
    - assets/models/phonon/
    # The recognizer's weights, ~40 MB, bundled so a fresh install can score
    # offline like the rest of the app. VoskAsr falls back to downloading them
    # if this line is pulled, so a size-sensitive build can trade the APK for a
    # first run that needs the network. Do not rename the file: ModelLoader
    # derives both the extraction directory and the folder it expects inside
    # the archive from this basename.
    - assets/models/vosk/vosk-model-small-en-us-0.15.zip
    # Fixture carried over from the Expo app's mispronounce_detector tests, for
    # PronunciationDebugScreen. Debug-only in spirit — pull this line (and the
    # file) before a release build ships it in the APK.
    - assets/debug/prod1.wav
    # Every cue FeedbackSoundPlayer plays -- correct.mp3 on a green sentence
    # score, session_complete.mp3 on finishing a session. Declared as a
    # folder so a new cue doesn't need its own pubspec line.
    - assets/sounds/
    # Flutter's directory asset declarations aren't recursive, so the ui/
    # subfolder (tap_sound.wav, played by playTapSound()) needs its own line.
    - assets/sounds/ui/
    # The Recall grade buttons' cues (wrong / partial / perfect), played by
    # GradeButtons.
    - assets/sounds/buttons_sound/

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # Manrope, the redesign's typeface (lingoFont in lib/theme/lingo_theme.dart).
  # Bundled rather than fetched at runtime, so the app never calls out to
  # Google: the variable font from github.com/google/fonts (ofl/manrope),
  # under the SIL Open Font License (assets/fonts/OFL.txt).
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Variable.ttf

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# App icon, generated from assets/branding/ with:
#   dart run flutter_launcher_icons
# icon.png is the full square (iOS, web, pre-Oreo Android); the adaptive
# foreground is the same glyph shrunk into Android's 66% safe zone, over the
# brand teal.
flutter_launcher_icons:
  image_path: assets/branding/icon.png
  android: true
  adaptive_icon_background: "#1CC4D1"
  adaptive_icon_foreground: assets/branding/icon_foreground.png
  # Already sized for the safe zone (and its stem runs to the edge), so no
  # extra inset on top.
  adaptive_icon_foreground_inset: 0
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/branding/icon.png
    background_color: "#1CC4D1"
    theme_color: "#1CC4D1"
